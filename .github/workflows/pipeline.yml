name: Build Scan Deploy
on: [push, workflow_dispatch]

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Scan image and create SBOM before push
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" aquasec/trivy:0.69.3 image --format json --output /work/trivy.json "$IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" aquasec/trivy:0.69.3 image --format cyclonedx --output /work/sbom.json "$IMAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy.json
            sbom.json

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image
        run: docker push "$IMAGE"

      - name: Create temporary Kubernetes cluster
        uses: engineerd/setup-kind@v0.6.0

      - name: Deploy and validate rollout
        run: |
          kind load docker-image "$IMAGE"
          sed "s|IMAGE_PLACEHOLDER|$IMAGE|" k8s.yaml | kubectl apply -f -
          kubectl rollout status deployment/web --timeout=90s
          kubectl rollout restart deployment/web
          kubectl rollout status deployment/web --timeout=90s

      - name: Demonstrate self-healing
        run: |
          POD=$(kubectl get pod -l app=web -o jsonpath='{.items[0].metadata.name}')
          kubectl delete pod "$POD"
          kubectl wait --for=condition=ready pod -l app=web --timeout=90s
          test "$(kubectl get pod -l app=web --field-selector=status.phase=Running --no-headers | wc -l)" -eq 2
